services:
  postgres:
    image: postgres:18
    container_name: kiri-postgres
    environment:
      POSTGRES_DB: kiri
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PW}
      TZ: "Asia/Seoul"
    ports:
      - "127.0.0.1:5432:5432"
    command: ["postgres", "-c", "timezone=Asia/Seoul", "-c", "log_timezone=Asia/Seoul"]
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: