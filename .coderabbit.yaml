# 리뷰 코멘트 언어
language: "ko-KR"

reviews:
  # 리뷰 강도: chill(핵심 위주) / assertive(꼼꼼하게, 코멘트 많음)
  profile: chill

  # PR 요약 코멘트
  # 파일별 변경 요약 표 숨김
  changed_files_summary: false
  # 워크스루 접기
  collapse_walkthrough: true
  # 축하 시 끄기
  poem: false
  # 시퀀스 다이어그램 끄기
  sequence_diagrams: false

  # 이슈 / PR 연동
  # 연결된 이슈(Closes #번호)의 요구사항 충족 여부 검사
  assess_linked_issues: true
  # 비슷한 과거 이슈 / PR 자동 추천 끄기
  related_issues: false
  related_prs: false
  # 레이블 / 리뷰어 추천 끄기
  suggested_labels: false
  suggested_reviewers: false

  #리뷰 대상 파일
  # '!'로 시작하는 파일 제외
  path_filters:
    # 빌드 산출물
    - "!**/build/**"
    - "!**/out/**"
    # Gradle Wrapper (자동 생성 파일)
    - "!gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"

  #자동 리뷰 트리거
  auto_review:
    # 리뷰할 PR base 브랜치
    base_branches:
      - "develop"
    # 새 커밋이 추가되면 변경된 부분만 다시 리뷰
    auto_incremental_review: true
    # Draft PR은 리뷰하지 않음
    drafts: false

chat:
  # 멘션 없이 모든 PR 코멘트에 답하지 않음
  auto_reply: false

# 이슈를 만들면 AI가 내용을 보강하고 구현 계획을 달아주는 기능 끄기
issue_enrichment:
  auto_enrich:
    enabled: false
  planning:
    enabled: false