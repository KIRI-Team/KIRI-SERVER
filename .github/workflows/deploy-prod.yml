name: Deploy prod

on:
  # prod는 관리자가 직접 배포
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  deploy:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      # t4g.small(2GB) 기준: 컨테이너 1.2GB, 힙은 약 720MB
      memory-limit: 1200m
      java-opts: -XX:MaxRAMPercentage=60.0
