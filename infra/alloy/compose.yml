name: kiri-alloy

services:
  alloy:
    image: grafana/alloy:v1.21.3
    container_name: kiri-alloy

    network_mode: host

    restart: unless-stopped

    mem_limit: 256m

    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    env_file: .env

    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/kiri-alloy:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: awslogs
      options:
        awslogs-region: ap-northeast-2
        awslogs-group: /kiri/${DEPLOY_ENV:?DEPLOY_ENV가 필요합니다 (.env 확인)}/app
        awslogs-stream: alloy