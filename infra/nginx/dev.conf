server_tokens off;

log_format json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"traceId":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

map $http_authorization $proxy_authorization {
    ~*^Basic\s "";
    default $http_authorization;
}

# 도메인이 아닌 요청
server {
    listen 80 default_server;
    server_name _;

    access_log off;

    return 444;
}

server{
    listen 443 ssl default_server;
    server_name _;

    access_log off;

    ssl_reject_handshake on;
}

# http
server{
    listen 80;
    server_name kiri-dev.halo-app.co.kr;

    access_log /var/log/nginx/access.log json;

    location /.well-known/acme-challenge/{
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

#https
server{
    listen 443 ssl;
    http2 on;
    server_name kiri-dev.halo-app.co.kr;

    access_log /var/log/nginx/access.log json;

    ssl_certificate /etc/letsencrypt/live/kiri-dev.halo-app.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiri-dev.halo-app.co.kr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 10m;

    # basic auth
    auth_basic "KIRI dev";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $proxy_authorization;

    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /actuator/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /actuator/info {
        proxy_pass http://127.0.0.1:8080;
    }

    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
