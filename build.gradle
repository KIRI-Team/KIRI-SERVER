plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.gorylenko.gradle-git-properties' version '4.0.1'
    id 'com.google.cloud.tools.jib' version '3.5.4'
    id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.kiri'
version = '0.0.1-SNAPSHOT'
description = 'KIRI-SERVER'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jjwt
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

tasks.named('test') {
    useJUnitPlatform()
}

// /actuator/info에 노출할 빌드 정보, git 정보 생성
springBoot {
    buildInfo {
        excludes = ['group', 'name', 'artifact', 'time']
    }
}

gitProperties {
    // 빌드한 사람의 이메일, 호스트 등은 제외
    keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time', 'git.dirty']
}

// 코드 포맷 설정
// - ./gradlew spotlessApply : 규칙대로 자동 수정
// - ./gradlew spotlessCheck : 규칙 위반 시 실패 (CI에서 사용)
spotless {
    java {
        // src/main, src/test 의 모든 Java 파일 대상
        target 'src/**/*.java'

        // 4칸 들여쓰기 기반 포맷터 (IntelliJ 기본 스타일과 가장 가까움)
        palantirJavaFormat('2.102.0')

        // 사용하지 않는 import 제거
        removeUnusedImports()

        // 줄 끝 공백 제거, 파일 끝 개행 보장
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// 컨테이너 빌드 이미지 설정
jib {
    from {
        image = 'eclipse-temurin:25-jre'
        platforms {
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }

    container {
        mainClass = 'com.kiri.server.KiriServerApplication'
        ports = ['8080']

        environment = ['TZ': 'Asia/Seoul']
        jvmFlags = [
                '-Duser.timezone=Asia/Seoul',
                '-XX:+ExitOnOutOfMemoryError'
        ]
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}
