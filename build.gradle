plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.gorylenko.gradle-git-properties' version '4.0.1'
    id 'com.google.cloud.tools.jib' version '3.5.4'
}

group = 'com.kiri'
version = '0.0.1-SNAPSHOT'
description = 'KIRI-SERVER'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // DB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dev
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jjwt
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // OIDC ID Token
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // AWS S3
    implementation platform('software.amazon.awssdk:bom:2.57.4')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:cloudfront'

    // Sentry
    implementation 'io.sentry:sentry-spring-boot-4:8.56.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

// /actuator/info에 노출할 빌드 정보, git 정보 생성
springBoot {
    buildInfo {
        excludes = ['group', 'name', 'artifact', 'time']
    }
}

gitProperties {
    // 빌드한 사람의 이메일, 호스트 등은 제외
    keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time', 'git.dirty']
}

// 컨테이너 빌드 이미지 설정
jib {
    from {
        image = 'eclipse-temurin:25-jre'
        platforms {
            platform {
                architecture = 'arm64'
                os = 'linux'
            }
        }
    }

    container {
        mainClass = 'com.kiri.server.KiriServerApplication'
        ports = ['8080']

        environment = ['TZ': 'Asia/Seoul']
        jvmFlags = [
                '-Duser.timezone=Asia/Seoul',
                '-XX:+ExitOnOutOfMemoryError'
        ]
        creationTime = 'USE_CURRENT_TIMESTAMP'
    }
}
