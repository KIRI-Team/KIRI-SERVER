# 테스트 전용 설정. 외부 연동 값은 더미로 채워 DB만 있으면 컨텍스트가 뜨도록 한다.
# 실제 서비스에 쓰이는 값은 하나도 없다.

# AdminAuthIntegrationTest가 /v3/api-docs/{admin,app}을 호출하므로 test 프로필에서만 api-docs를 켠다
springdoc:
  api-docs:
    enabled: true

jwt:
  secret: test-jwt-secret-must-be-at-least-32-bytes

kakao:
  client-id: test-kakao

google:
  client-id: test-google

apple:
  client-id: test-apple

aws:
  s3:
    bucket: test-bucket
  cloudfront:
    cdn-base-url: https://test.cloudfront.net
    key-pair-id: KTESTKEYPAIRID
    # 테스트용으로 생성한 일회용 RSA 키(PKCS#8 DER, base64). 어떤 CloudFront 키 쌍과도 연결돼 있지 않다.
    private-key: 

openai:
  api-key: test-openai
