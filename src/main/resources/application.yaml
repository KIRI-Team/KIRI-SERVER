spring:
  application:
    name: KIRI-SERVER

  profiles:
    default: local

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: postgresql
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
        query:
          fail_on_pagination_over_collection_fetch: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  info:
    git:
      mode: full

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
    doc-expansion: none
    filter: true
    default-models-expand-depth: -1
    try-it-out-enabled: true
    default-model-rendering: example
  default-produces-media-type: application/json
  paths-to-match: /api/**
  override-with-generic-response: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

kakao:
  client-id: ${KAKAO_NATIVE_APP_KEY}
  jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
  issuer: https://kauth.kakao.com

google:
  client-id: ${GOOGLE_CLIENT_ID}
  jwks-uri: https://www.googleapis.com/oauth2/v3/certs
  issuer: https://accounts.google.com

apple:
  client-id: ${APPLE_CLIENT_ID}
  issuer: https://appleid.apple.com
  jwks-uri: https://appleid.apple.com/auth/keys

tour-api:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_KEY:}
  mobile-app: KIRI
  num-of-rows: 1000
  region-code: "11"
  connect-timeout: 3s
  read-timeout: 10s
  max-calls-per-run: 240
  sync-cron: "0 0 */6 * * *"

aws:
  s3:
    region: ap-northeast-2
    bucket: ${S3_BUCKET}
    presigned-url-expiration: 5m