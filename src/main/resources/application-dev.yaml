spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  stuctured:
    format:
      console: logstash
    json:
      add:
        service: kiri-server

sentry:
  dsn: ${SENTRY_DSN}
  environment: dev

